<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Διαγραφή — Ran-Tevu</title>
<style>
  :root { --primary:#7C3AED; --text:#111827; --text-muted:#6B7280; --border:#E5E7EB; --bg:#FAFAFA; --success:#10B981; --error:#EF4444; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--text); background:var(--bg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); padding:40px; max-width:480px; width:100%; text-align:center; }
  .icon { width:72px; height:72px; margin:0 auto 20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:36px; }
  .icon.ok { background:#D1FAE5; color:var(--success); }
  .icon.err { background:#FEE2E2; color:var(--error); }
  .icon.ask { background:#EDE9FE; color:var(--primary); }
  h1 { font-size:24px; font-weight:800; margin-bottom:12px; }
  p { color:#374151; line-height:1.6; margin-bottom:20px; font-size:15px; }
  .email { background:var(--bg); border-radius:8px; padding:10px 14px; font-family:monospace; font-size:14px; color:var(--text); margin:8px 0 20px; word-break:break-all; }
  button { background:var(--primary); color:#fff; border:none; padding:12px 28px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  button:hover { background:#5B21B6; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .back { display:inline-block; margin-top:20px; color:var(--text-muted); font-size:14px; text-decoration:none; }
  .back:hover { color:var(--primary); }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="icon ask">✉️</div>
  <h1>Διαγραφή από email list</h1>
  <p>Επιβεβαίωσε ότι θες να διαγραφείς από τη λίστα του Ran-Tevu.</p>
  <div class="email" id="email">—</div>
  <button onclick="confirmUnsub()" id="btn">Επιβεβαίωση διαγραφής</button>
  <a href="/" class="back">← Επιστροφή στην αρχική</a>
</div>

<script>
const params = new URLSearchParams(location.search);
const email  = params.get('email') || '';
const token  = params.get('t') || '';
document.getElementById('email').textContent = email || '(δεν δόθηκε email)';

async function confirmUnsub() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Διαγραφή...';
  try {
    const res = await fetch('/api/unsubscribe', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, token})
    });
    const data = await res.json();
    const card = document.getElementById('card');
    if (res.ok) {
      card.innerHTML = `
        <div class="icon ok">✓</div>
        <h1>Έγινε</h1>
        <p>Η διεύθυνση <strong>${email}</strong> διαγράφηκε από τη λίστα μας. Δεν θα λάβεις άλλα emails από εμάς.</p>
        <a href="/" class="back">← Επιστροφή στην αρχική</a>`;
    } else {
      card.innerHTML = `
        <div class="icon err">!</div>
        <h1>Σφάλμα</h1>
        <p>${data.error || 'Δεν μπορέσαμε να ολοκληρώσουμε τη διαγραφή. Στείλε email στο <a href="mailto:ntinosgkiou@gmail.com">ntinosgkiou@gmail.com</a>.'}</p>
        <a href="/" class="back">← Επιστροφή στην αρχική</a>`;
    }
  } catch (e) {
    alert('Πρόβλημα σύνδεσης. Δοκίμασε ξανά.');
    btn.disabled = false;
    btn.textContent = 'Επιβεβαίωση διαγραφής';
  }
}
</script>

</body>
</html>
