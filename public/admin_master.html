<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Admin Panel</title>
<style>
  :root {
    --primary: #7C3AED;
    --primary-light: #EDE9FE;
    --danger: #EF4444;
    --success: #10B981;
    --bg: #F3F4F6;
    --surface: #FFFFFF;
    --text: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Auth */
  #auth-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .auth-card {
    background: white; border-radius: 16px; padding: 40px;
    width: 100%; max-width: 380px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center;
  }
  .auth-card h1 { font-size: 22px; margin-bottom: 6px; }
  .auth-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .auth-card input {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 16px; font-size: 15px; outline: none; margin-bottom: 14px;
  }
  .auth-card input:focus { border-color: var(--primary); }
  .btn-primary {
    width: 100%; background: var(--primary); color: white; border: none;
    border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover { background: #6D28D9; }
  #auth-error { color: var(--danger); font-size: 13px; margin-top: 10px; }

  #app { display: none; }

  /* Header */
  header {
    background: white; border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex; align-items: center; gap: 16px;
    box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10;
  }
  .logo {
    font-size: 22px; font-weight: 800; color: var(--primary);
    letter-spacing: -.5px;
  }
  .logo span { color: var(--text); font-weight: 500; font-size: 14px; margin-left: 6px; }
  .master-badge {
    background: linear-gradient(135deg, #7C3AED, #4F46E5);
    color: white; border-radius: 20px; padding: 3px 12px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase;
  }
  #add-btn {
    margin-left: auto;
    background: var(--primary); color: white; border: none;
    border-radius: 10px; padding: 10px 20px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: background .15s;
  }
  #add-btn:hover { background: #6D28D9; }

  main { padding: 28px; max-width: 1200px; margin: 0 auto; }

  /* Summary stats */
  .top-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 28px;
  }
  .top-stat {
    background: white; border-radius: 12px; padding: 20px;
    box-shadow: var(--shadow);
  }
  .top-stat .n {
    font-size: 36px; font-weight: 800; line-height: 1;
    margin-bottom: 4px; color: var(--primary);
  }
  .top-stat .l { font-size: 13px; color: var(--text-muted); }

  /* Business cards */
  #biz-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }
  .biz-card {
    background: white; border-radius: 14px; padding: 24px;
    box-shadow: var(--shadow); border: 2px solid transparent;
    transition: border-color .15s, box-shadow .15s;
  }
  .biz-card:hover { border-color: var(--primary-light); box-shadow: 0 4px 16px rgba(124,58,237,.08); }
  .biz-card.inactive { opacity: .55; }
  .biz-card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .biz-avatar {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .biz-name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .biz-type { font-size: 12px; color: var(--text-muted); }
  .biz-active-badge {
    margin-left: auto; border-radius: 20px; padding: 3px 10px;
    font-size: 11px; font-weight: 600;
  }
  .biz-active-badge.on { background: #ECFDF5; color: #059669; }
  .biz-active-badge.off { background: #F3F4F6; color: #9CA3AF; }

  .biz-meta { display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px; }
  .biz-meta-row { display: flex; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .biz-meta-row strong { color: var(--text); font-weight: 500; }

  .biz-token {
    background: #F8F7FF; border: 1px solid var(--primary-light);
    border-radius: 8px; padding: 8px 12px;
    font-family: 'Courier New', monospace; font-size: 12px;
    color: var(--primary); display: flex; align-items: center;
    gap: 8px; margin-bottom: 16px; cursor: pointer; user-select: all;
  }
  .biz-token:hover { background: var(--primary-light); }
  .biz-token .copy-icon { font-size: 14px; }

  .biz-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm {
    border-radius: 8px; padding: 7px 14px; font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all .15s;
    text-decoration: none; display: inline-block;
  }
  .btn-outline {
    background: transparent; border: 1.5px solid var(--border); color: var(--text);
  }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger {
    background: transparent; border: 1.5px solid var(--danger); color: var(--danger);
  }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-success {
    background: transparent; border: 1.5px solid var(--success); color: var(--success);
  }
  .btn-success:hover { background: var(--success); color: white; }
  .btn-chat {
    background: var(--primary-light); border: none; color: var(--primary);
  }
  .btn-chat:hover { background: var(--primary); color: white; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 16px; padding: 32px;
    width: 100%; max-width: 580px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    animation: modalIn .2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.95) translateY(-10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h2 { font-size: 20px; margin-bottom: 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; outline: none;
    font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--primary);
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
  .btn-cancel {
    background: transparent; border: 1.5px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 20px; font-size: 14px;
    cursor: pointer; font-weight: 500;
  }
  .btn-save {
    background: var(--primary); color: white; border: none;
    border-radius: 8px; padding: 10px 24px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .btn-save:hover { background: #6D28D9; }

  .section-title {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em;
    margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #1F2937; color: white;
    border-radius: 10px; padding: 12px 20px;
    font-size: 14px; z-index: 200;
    transform: translateY(80px); opacity: 0;
    transition: all .3s;
    pointer-events: none;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  .spinner-sm {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 580px) {
    .form-grid { grid-template-columns: 1fr; }
    main { padding: 16px; }
    #biz-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth-screen">
  <div class="auth-card">
    <div style="font-size:44px;margin-bottom:16px">🚀</div>
    <h1>Master Admin</h1>
    <p>Διαχείριση όλων των επιχειρήσεων</p>
    <input type="password" id="token-input" placeholder="Master Token" autocomplete="off">
    <button class="btn-primary" onclick="login()">Είσοδος</button>
    <div id="auth-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="logo">Admin<span>Panel</span></div>
    <div class="master-badge">Master Admin</div>
    <button id="add-btn" onclick="openAddModal()">+ Νέα Επιχείρηση</button>
  </header>

  <main>
    <div class="top-stats">
      <div class="top-stat">
        <div class="n" id="stat-biz">—</div>
        <div class="l">Επιχειρήσεις</div>
      </div>
      <div class="top-stat">
        <div class="n" id="stat-active">—</div>
        <div class="l">Ενεργές</div>
      </div>
    </div>

    <div class="section-title">Επιχειρήσεις</div>
    <div id="biz-grid">
      <div style="padding:40px;text-align:center;color:var(--text-muted)">
        <div class="spinner-sm" style="border-top-color:var(--primary);border-color:var(--border)"></div>
        Φόρτωση...
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Νέα Επιχείρηση</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Slug (URL) *</label>
        <input type="text" id="f-slug" placeholder="nails-maria" oninput="slugify(this)">
        <div class="hint">Μόνο a-z, 0-9, παύλα. π.χ. nails-maria</div>
      </div>
      <div class="form-group">
        <label>Όνομα Επιχείρησης *</label>
        <input type="text" id="f-name" placeholder="Nails by Maria">
      </div>
      <div class="form-group">
        <label>Τύπος</label>
        <select id="f-type">
          <option value="nail studio">Nail Studio</option>
          <option value="beauty">Beauty / Αισθητική</option>
          <option value="spa">Spa / Wellness</option>
          <option value="hair">Κομμωτήριο</option>
          <option value="dental">Οδοντιατρείο</option>
          <option value="ψυχολόγος">Ψυχολόγος</option>
          <option value="κτηνιατρείο">Κτηνιατρείο</option>
          <option value="fitness">Fitness / Γυμναστήριο</option>
          <option value="other">Άλλο</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tagline</label>
        <input type="text" id="f-tagline" placeholder="AI Γραμματεία 24/7">
      </div>
      <div class="form-group">
        <label>Τηλέφωνο *</label>
        <input type="tel" id="f-phone" placeholder="6912345678">
      </div>
      <div class="form-group">
        <label>Διεύθυνση</label>
        <input type="text" id="f-address" placeholder="Ερμού 10, Αθήνα">
      </div>
      <div class="form-group">
        <label>Ιδιοκτήτης (όνομα)</label>
        <input type="text" id="f-owner-name" placeholder="Μαρία Παπαδοπούλου">
      </div>
      <div class="form-group">
        <label>Email ιδιοκτήτη</label>
        <input type="email" id="f-owner-email" placeholder="maria@example.com">
      </div>

      <div class="form-group full" style="margin-top:8px">
        <div class="section-title">Ωράριο (JSON)</div>
        <textarea id="f-hours" rows="4" placeholder='{"Δευτέρα":"10:00 - 20:00","Τρίτη":"10:00 - 20:00","Τετάρτη":"10:00 - 20:00","Πέμπτη":"10:00 - 20:00","Παρασκευή":"10:00 - 20:00","Σάββατο":"10:00 - 16:00","Κυριακή":"Κλειστά"}'></textarea>
      </div>

      <div class="form-group full">
        <div class="section-title">Υπηρεσίες (JSON array)</div>
        <textarea id="f-services" rows="5" placeholder='[{"name":"Manicure","duration":60,"price":25},{"name":"Pedicure","duration":60,"price":30}]'></textarea>
        <div class="hint">Κάθε υπηρεσία: {"name":"...", "duration": λεπτά, "price": €}</div>
      </div>

      <div class="form-group">
        <label>Ώρα έναρξης</label>
        <input type="time" id="f-day-start" value="10:00">
      </div>
      <div class="form-group">
        <label>Ώρα λήξης</label>
        <input type="time" id="f-day-end" value="20:00">
      </div>
      <div class="form-group">
        <label>Slot (λεπτά)</label>
        <input type="number" id="f-slot" value="30" min="15" max="120" step="15">
      </div>

      <div class="form-group">
        <label>SMTP Email (για αποστολές)</label>
        <input type="email" id="f-smtp-email" placeholder="noreply@yourdomain.com">
      </div>
      <div class="form-group">
        <label>SMTP Password</label>
        <input type="password" id="f-smtp-pass" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label>Admin Token (αυτόματο αν αφεθεί κενό)</label>
        <input type="text" id="f-admin-token" placeholder="αυτόματο">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Ακύρωση</button>
      <button class="btn-save" id="save-btn" onclick="saveBusiness()">Αποθήκευση</button>
    </div>
    <div id="modal-error" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  let MASTER_TOKEN = localStorage.getItem('master_token') || '';
  let businesses   = [];
  let editingSlug  = null;

  // ── Auth ──────────────────────────────────────────────────────────────────────
  async function login() {
    const tok = document.getElementById('token-input').value.trim();
    if (!tok) return;
    const r = await fetch('/api/admin/businesses', {
      headers: { Authorization: 'Bearer ' + tok }
    });
    if (r.ok) {
      MASTER_TOKEN = tok;
      localStorage.setItem('master_token', tok);
      showApp();
    } else {
      document.getElementById('auth-error').textContent = 'Λαθος master token';
    }
  }
  document.getElementById('token-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });

  if (MASTER_TOKEN) {
    fetch('/api/admin/businesses', { headers: { Authorization: 'Bearer ' + MASTER_TOKEN } })
      .then(function(r) { if (r.ok) showApp(); })
      .catch(function() {});
  }

  function showApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadBusinesses();
  }

  // ── Load ──────────────────────────────────────────────────────────────────────
  async function loadBusinesses() {
    const r = await fetch('/api/admin/businesses', {
      headers: { Authorization: 'Bearer ' + MASTER_TOKEN }
    });
    if (!r.ok) {
      if (r.status === 401) { localStorage.removeItem('master_token'); location.reload(); }
      return;
    }
    businesses = await r.json();
    renderStats();
    renderGrid();
  }

  function renderStats() {
    document.getElementById('stat-biz').textContent    = businesses.length;
    document.getElementById('stat-active').textContent = businesses.filter(function(b) { return b.active; }).length;
  }

  function renderGrid() {
    var grid = document.getElementById('biz-grid');
    if (!businesses.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;padding:60px;text-align:center;color:var(--text-muted)"><div style="font-size:48px;margin-bottom:12px">🏢</div><div style="font-weight:600">Καμία επιχείρηση ακόμα</div><div style="font-size:13px;margin-top:6px">Πάτα "+ Νέα Επιχείρηση" για να ξεκινήσεις.</div></div>';
      return;
    }
    var base = window.location.origin;
    grid.innerHTML = businesses.map(function(b) {
      var chatUrl  = base + '/' + b.slug;
      var adminUrl = base + '/admin/' + b.slug;
      return '<div class="biz-card' + (b.active ? '' : ' inactive') + '">' +
        '<div class="biz-card-top">' +
        '<div class="biz-avatar">' + getEmoji(b.name, b.type) + '</div>' +
        '<div><div class="biz-name">' + esc(b.name) + '</div><div class="biz-type">' + esc(b.type || '') + '</div></div>' +
        '<span class="biz-active-badge ' + (b.active ? 'on' : 'off') + '">' + (b.active ? '● Ενεργή' : '○ Ανενεργή') + '</span>' +
        '</div>' +
        '<div class="biz-meta">' +
        '<div class="biz-meta-row"><strong>Slug:</strong> <span style="font-family:monospace">' + esc(b.slug) + '</span></div>' +
        '<div class="biz-meta-row"><strong>Τηλ:</strong> ' + esc(b.phone || '—') + '</div>' +
        '</div>' +
        (b.admin_token ? '<div class="biz-token" onclick="copyText(\'' + esc(b.admin_token) + '\')" title="Κλικ για αντιγραφή"><span class="copy-icon">🔑</span> ' + esc(b.admin_token) + '</div>' : '') +
        '<div class="biz-actions">' +
        '<a class="btn-sm btn-chat" href="' + chatUrl + '" target="_blank">💬 Chat</a>' +
        '<a class="btn-sm btn-outline" href="' + adminUrl + '" target="_blank">📊 Admin</a>' +
        '<button class="btn-sm btn-outline" onclick="copyToken(\'' + esc(b.slug) + '\', \'' + adminUrl + '\')">📋 URLs</button>' +
        '<button class="btn-sm ' + (b.active ? 'btn-danger' : 'btn-success') + '" onclick="toggleBiz(\'' + b.slug + '\')">' +
        (b.active ? 'Απενεργοποίηση' : 'Ενεργοποίηση') + '</button>' +
        '</div>' +
        '</div>';
    }).join('');
  }

  // ── Toggle ────────────────────────────────────────────────────────────────────
  async function toggleBiz(slug) {
    var r = await fetch('/api/admin/businesses/' + slug + '/toggle', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + MASTER_TOKEN }
    });
    if (r.ok) { loadBusinesses(); toast('Ενημερώθηκε'); }
  }

  // ── Modal ─────────────────────────────────────────────────────────────────────
  var DEFAULT_HOURS = JSON.stringify({
    "Δευτέρα":"10:00 - 20:00","Τρίτη":"10:00 - 20:00","Τετάρτη":"10:00 - 20:00",
    "Πέμπτη":"10:00 - 20:00","Παρασκευή":"10:00 - 20:00",
    "Σάββατο":"10:00 - 16:00","Κυριακή":"Κλειστά"
  }, null, 2);

  var DEFAULT_SERVICES = JSON.stringify([
    {"name":"Manicure","duration":60,"price":25},
    {"name":"Pedicure","duration":60,"price":30},
    {"name":"Gel Manicure","duration":75,"price":35}
  ], null, 2);

  function openAddModal() {
    editingSlug = null;
    document.getElementById('modal-title').textContent = 'Νέα Επιχείρηση';
    document.getElementById('save-btn').textContent    = 'Αποθήκευση';
    clearForm();
    document.getElementById('f-slug').disabled  = false;
    document.getElementById('f-hours').value    = DEFAULT_HOURS;
    document.getElementById('f-services').value = DEFAULT_SERVICES;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modal-error').textContent = '';
  }

  function clearForm() {
    ['f-slug','f-name','f-tagline','f-phone','f-address',
     'f-owner-name','f-owner-email','f-smtp-email','f-smtp-pass','f-admin-token'].forEach(function(id) {
       document.getElementById(id).value = '';
     });
    document.getElementById('f-type').value      = 'nail studio';
    document.getElementById('f-day-start').value = '10:00';
    document.getElementById('f-day-end').value   = '20:00';
    document.getElementById('f-slot').value      = '30';
    document.getElementById('f-hours').value     = '';
    document.getElementById('f-services').value  = '';
  }

  function slugify(el) {
    el.value = el.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-');
  }

  async function saveBusiness() {
    document.getElementById('modal-error').textContent = '';
    var slug  = document.getElementById('f-slug').value.trim();
    var name  = document.getElementById('f-name').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    if (!name || !phone) {
      document.getElementById('modal-error').textContent = 'Συμπλήρωσε τουλάχιστον Όνομα και Τηλέφωνο.';
      return;
    }
    if (!editingSlug && !slug) {
      document.getElementById('modal-error').textContent = 'Συμπλήρωσε το Slug.';
      return;
    }

    var hoursRaw    = document.getElementById('f-hours').value.trim();
    var servicesRaw = document.getElementById('f-services').value.trim();
    var hours, services;
    try { hours = hoursRaw ? JSON.parse(hoursRaw) : {}; }
    catch(e) { document.getElementById('modal-error').textContent = 'Λάθος JSON στο Ωράριο.'; return; }
    try { services = servicesRaw ? JSON.parse(servicesRaw) : []; }
    catch(e) { document.getElementById('modal-error').textContent = 'Λάθος JSON στις Υπηρεσίες.'; return; }

    var payload = {
      name: name, phone: phone,
      type:       document.getElementById('f-type').value,
      tagline:    document.getElementById('f-tagline').value.trim(),
      address:    document.getElementById('f-address').value.trim(),
      owner_name: document.getElementById('f-owner-name').value.trim(),
      owner_email:document.getElementById('f-owner-email').value.trim(),
      smtp_email: document.getElementById('f-smtp-email').value.trim(),
      smtp_password: document.getElementById('f-smtp-pass').value.trim(),
      admin_token:document.getElementById('f-admin-token').value.trim(),
      day_start:  document.getElementById('f-day-start').value,
      day_end:    document.getElementById('f-day-end').value,
      slot_minutes: parseInt(document.getElementById('f-slot').value) || 30,
      hours: hours, services: services
    };

    var btn = document.getElementById('save-btn');
    btn.innerHTML = '<span class="spinner-sm"></span>Αποθήκευση...';
    btn.disabled = true;

    try {
      var r;
      if (editingSlug) {
        r = await fetch('/api/admin/businesses/' + editingSlug, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + MASTER_TOKEN },
          body: JSON.stringify(payload)
        });
      } else {
        payload.slug = slug;
        r = await fetch('/api/admin/businesses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + MASTER_TOKEN },
          body: JSON.stringify(payload)
        });
      }

      if (r.ok) {
        var data = await r.json();
        closeModal();
        loadBusinesses();
        toast(editingSlug ? 'Ενημερώθηκε!' : 'Δημιουργήθηκε! Token: ' + (data.admin_token || ''));
        if (!editingSlug && data.admin_token) {
          setTimeout(function() {
            alert('Admin Token: ' + data.admin_token + '\n\nΑποθήκευσέ το — δεν θα εμφανιστεί ξανά!');
          }, 200);
        }
      } else {
        var err = await r.json();
        document.getElementById('modal-error').textContent = err.error || 'Σφάλμα αποθήκευσης';
      }
    } catch(e) {
      document.getElementById('modal-error').textContent = 'Σφάλμα σύνδεσης';
    } finally {
      btn.innerHTML = 'Αποθήκευση';
      btn.disabled = false;
    }
  }

  // ── Copy ──────────────────────────────────────────────────────────────────────
  function copyText(text) {
    navigator.clipboard.writeText(text).then(function() { toast('Αντιγράφηκε!'); });
  }

  function copyToken(slug, adminUrl) {
    var biz = businesses.find(function(b) { return b.slug === slug; });
    var text = 'Chat: ' + window.location.origin + '/' + slug +
               '\nAdmin: ' + adminUrl +
               (biz && biz.admin_token ? '\nAdmin Token: ' + biz.admin_token : '');
    navigator.clipboard.writeText(text).then(function() { toast('URLs & token αντιγράφηκαν!'); });
  }

  // ── Toast ─────────────────────────────────────────────────────────────────────
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2800);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────────
  var TYPE_EMOJI = {
    'nail': '💅', 'beauty': '✨', 'spa': '🧖', 'hair': '✂️',
    'dental': '🦷', 'psych': '🧠', 'fitness': '💪', 'gym': '💪',
    'vet': '🐾', 'kthn': '🐾', 'trainer': '💪'
  };
  function getEmoji(name, type) {
    var s = (name + ' ' + (type || '')).toLowerCase();
    for (var k in TYPE_EMOJI) {
      if (s.indexOf(k) !== -1) return TYPE_EMOJI[k];
    }
    return '🤝';
  }
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
