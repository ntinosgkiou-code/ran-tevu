<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline — Ran-Tevu Admin</title>
<style>
  :root { --bg:#0a0a0f; --surface:#111827; --surface-2:#1f2937; --border:rgba(255,255,255,0.08); --text:#e5e7eb; --muted:#9ca3af; --primary:#7c3aed; --accent:#ec4899; --gold:#fbbf24; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  h1 { color: white; font-size: 26px; font-weight: 800; }
  .back { color: var(--primary); font-size: 14px; text-decoration: none; }
  .kanban {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    overflow-x: auto;
  }
  @media (max-width: 1000px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
  .column {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; min-height: 500px;
  }
  .col-header {
    font-size: 12px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1px; padding: 8px 4px; margin-bottom: 10px;
    border-bottom: 2px solid var(--col-color);
  }
  .col-new { --col-color: #7c3aed; color: #c084fc; }
  .col-contacted { --col-color: #3b82f6; color: #60a5fa; }
  .col-replied { --col-color: #fbbf24; color: #fbbf24; }
  .col-won { --col-color: #10b981; color: #34d399; }
  .col-lost { --col-color: #ef4444; color: #f87171; }
  .col-count { float: right; background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 100px; font-size: 11px; }
  .card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 8px; cursor: grab;
    transition: transform 0.15s, border-color 0.15s;
  }
  .card:hover { border-color: var(--primary); transform: translateY(-1px); }
  .card-name { font-weight: 700; font-size: 13px; color: white; margin-bottom: 4px; }
  .card-meta { font-size: 11px; color: var(--muted); }
  .card-score { float: right; color: var(--gold); font-weight: 800; }
  .card-actions { display: flex; gap: 4px; margin-top: 8px; }
  .card-actions button { flex: 1; padding: 4px; font-size: 11px; border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 4px; cursor: pointer; }
  .card-actions button:hover { background: var(--surface); color: white; }
  .empty-col { text-align: center; color: var(--muted); padding: 20px; font-size: 12px; opacity: 0.5; }
</style>
</head>
<body>
<header>
  <div>
    <a href="javascript:history.back()" class="back">← Back</a>
    <h1>📊 Sales Pipeline</h1>
  </div>
  <button onclick="load()" style="background:var(--surface-2);color:white;border:1px solid var(--border);padding:8px 16px;border-radius:8px;cursor:pointer;">🔄 Refresh</button>
</header>

<div class="kanban" id="kanban">Loading...</div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || localStorage.getItem("admin_token") || "";
if (TOKEN) localStorage.setItem("admin_token", TOKEN);

const COL_LABELS = {
  new: "🆕 Νέα",
  contacted: "📞 Contacted",
  replied: "💬 Replied",
  won: "🎉 Won",
  lost: "❌ Lost",
};

async function load() {
  try {
    const r = await fetch("/api/admin/pipeline", { headers: { "Authorization": "Bearer " + TOKEN } });
    const data = await r.json();
    render(data);
  } catch (e) {
    document.getElementById("kanban").innerHTML = `<div style="color:#f87171">Error: ${e.message}</div>`;
  }
}

function render(data) {
  const stages = ["new", "contacted", "replied", "won", "lost"];
  document.getElementById("kanban").innerHTML = stages.map(stage => {
    const leads = data.columns[stage] || [];
    return `
      <div class="column">
        <div class="col-header col-${stage}">
          ${COL_LABELS[stage]} <span class="col-count">${leads.length}</span>
        </div>
        ${leads.length ? leads.map(l => `
          <div class="card">
            <div class="card-score">${l.score || 0}</div>
            <div class="card-name">${esc(l.business_name || "(no name)")}</div>
            <div class="card-meta">${esc(l.industry || "—")} · ${esc(l.email || "no email")}</div>
            <div class="card-actions">
              ${stages.filter(s => s !== stage).slice(0, 3).map(s => `
                <button onclick="move(${l.id}, '${s}')" title="Move to ${s}">${COL_LABELS[s].split(' ')[0]}</button>
              `).join("")}
            </div>
          </div>
        `).join("") : '<div class="empty-col">Κενό</div>'}
      </div>
    `;
  }).join("");
}

async function move(id, status) {
  await fetch(`/api/admin/leads/${id}/move`, {
    method: "POST", headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
  load();
}

function esc(s) { return (s||"").toString().replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"})[c]); }

load();
</script>
</body>
</html>
